<!DOCTYPE html>
<html>
<head>
    <title>TuneWave - Payment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

    <h1>🎵 TuneWave</h1>

    <nav>
        <a href="home.html">🏠 Home</a>
        <a href="songs.html">🎵 Songs</a>
        <a href="playlist.html">📂 Playlists</a>
        <a href="premium.html">⭐ Premium</a>
        <a href="login.html">🚪 Logout</a>
    </nav>

</div>


<div class="main-content">

    <h2>💳 Choose Payment Method</h2>

    <p>Select a payment method to continue</p>

    <div class="payment-container">

        <div class="payment-card">

            <h3>UPI</h3>

            <label>
                <input type="radio" name="payment">
                Google Pay
            </label>

            <br><br>

            <label>
                <input type="radio" name="payment">
                PhonePe
            </label>

            <br><br>

            <label>
                <input type="radio" name="payment">
                Paytm
            </label>

        </div>


        <div class="payment-card">

            <h3>💳 Card</h3>

            <label>
                <input type="radio" name="payment">
                Credit / Debit Card
            </label>

            <br><br>

            <p>Card payment is available in this demo.</p>

        </div>


        <div class="payment-card">

            <h3>🏦 Net Banking</h3>

            <label>
                <input type="radio" name="payment">
                Net Banking
            </label>

            <br><br>

            <p>Choose your bank in the demo.</p>

        </div>

    </div>

    <br><br>

    <button onclick="makePayment()">Pay Now</button>

</div>


<script>

function makePayment() {

    alert("Demo payment successful! 🎉");

    window.location.href = "success.html";

}

</script>

</body>
</html>
