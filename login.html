<!DOCTYPE html>
<html>

<head>

    <title>TuneWave - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h1>🎵 TuneWave</h1>

        <nav>

            <a href="home.html">🏠 Home</a>

            <a href="songs.html">🎵 Songs</a>

            <a href="playlist.html">📂 Playlists</a>

            <a href="premium.html">⭐ Premium</a>

            <a href="login.html">🚪 Login</a>

        </nav>

    </div>


    <!-- MAIN CONTENT -->

    <div class="main-content">

        <h2>🔐 Welcome Back!</h2>

        <p>Login to continue listening to your favorite music 🎵</p>


        <div class="player-box">

            <form onsubmit="loginUser(); return false;">

                <!-- EMAIL -->

                <label>Email</label>

                <br><br>

                <input type="email"
                       id="loginEmail"
                       placeholder="Enter your email"
                       required>

                <br><br>


                <!-- PASSWORD -->

                <label>Password</label>

                <br><br>

                <input type="password"
                       id="loginPassword"
                       placeholder="Enter your password"
                       required>

                <br><br>


                <!-- LOGIN BUTTON -->

                <button type="submit">

                    🔐 Login

                </button>

            </form>


            <br><br>


            <p>Don't have an account?</p>


            <a href="register.html">

                <button>

                    📝 Register

                </button>

            </a>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
